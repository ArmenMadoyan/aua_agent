name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - 'paper/**'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
      - '*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/capstone-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/capstone-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region eu-central-1 --name capstone-eks

      - name: Sync app-secrets from GitHub Secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl apply -f infrastructure/k8s/namespace.yaml
          kubectl create secret generic app-secrets -n capstone \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-postgres}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          # Apply any manifest changes
          kubectl apply -f infrastructure/k8s/postgres.yaml
          kubectl apply -f infrastructure/k8s/backend.yaml
          kubectl apply -f infrastructure/k8s/frontend.yaml

          # Update images to the new tag
          kubectl set image deployment/backend \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:${{ github.sha }} \
            -n capstone
          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:${{ github.sha }} \
            -n capstone

          # Force a restart so pods pick up updated secrets
          kubectl rollout restart deployment/backend -n capstone
          kubectl rollout restart deployment/frontend -n capstone

          # Wait for rollouts
          kubectl rollout status deployment/backend -n capstone --timeout=180s
          kubectl rollout status deployment/frontend -n capstone --timeout=180s
