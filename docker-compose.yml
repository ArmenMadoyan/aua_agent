services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aua_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aua_agent
    volumes:
      - ./aua_policy_pdfs:/app/aua_policy_pdfs:ro
      - generated_course:/app/generated_course
      - rag_state:/app/rag_state
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aua_agent
    volumes:
      - ./aua_policy_pdfs:/app/aua_policy_pdfs:ro
      - generated_course:/app/generated_course
      - rag_state:/app/rag_state
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  generated_course:
  rag_state:
